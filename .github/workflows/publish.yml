name: Publish

on:
  push:
    branches: [main, github/*]
    tags: ['v*', '*.*.*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  GH_PAT: ${{ secrets.TOKEN }}

jobs:
  deploy-shared:
    name: Deploy dusk-module-workflow-shared to GitHub Packages
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure GitHub Packages Maven settings
        if: ${{ env.GH_PAT != '' }}
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'MAVEN_SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-dusk-dependencies</id>
                <username>MouckIS</username>
                <password>${env.GH_PAT}</password>
              </server>
              <server>
                <id>github-dusk-module-parent</id>
                <username>MouckIS</username>
                <password>${env.GH_PAT}</password>
              </server>
              <server>
                <id>github-dusk-module-shared-parent</id>
                <username>MouckIS</username>
                <password>${env.GH_PAT}</password>
              </server>
              <server>
                <id>github-dusk-common</id>
                <username>MouckIS</username>
                <password>${env.GH_PAT}</password>
              </server>
              <server>
                <id>github-dusk-module-workflow</id>
                <username>MouckIS</username>
                <password>${env.GH_PAT}</password>
              </server>
            </servers>
            <repositories>
              <repository>
                <id>central</id>
                <url>https://repo.maven.apache.org/maven2</url>
              </repository>
              <repository>
                <id>github-dusk-dependencies</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-dependencies</url>
              </repository>
              <repository>
                <id>github-dusk-module-parent</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-module-parent</url>
              </repository>
              <repository>
                <id>github-dusk-module-shared-parent</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-module-shared-parent</url>
              </repository>
              <repository>
                <id>github-dusk-common</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-common</url>
              </repository>
            </repositories>
          </settings>
          MAVEN_SETTINGS

      - name: Check TOKEN secret
        if: ${{ env.GH_PAT == '' }}
        shell: bash
        run: |
          echo "::error::Secret TOKEN is missing. Create a GitHub PAT with write:packages and save it as repository secret TOKEN."
          exit 1

      - name: Deploy shared module
        run: mvn -B -ntp -U -DskipTests -pl dusk-module-workflow-shared -am deploy -DaltDeploymentRepository=github-dusk-module-workflow::default::https://maven.pkg.github.com/MouckIS/dusk-module-workflow

  release:
    name: Build and create GitHub Release
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure GitHub Packages Maven settings
        if: ${{ env.GH_PAT != '' }}
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'MAVEN_SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-dusk-dependencies</id>
                <username>MouckIS</username>
                <password>${env.GH_PAT}</password>
              </server>
              <server>
                <id>github-dusk-module-parent</id>
                <username>MouckIS</username>
                <password>${env.GH_PAT}</password>
              </server>
              <server>
                <id>github-dusk-module-shared-parent</id>
                <username>MouckIS</username>
                <password>${env.GH_PAT}</password>
              </server>
              <server>
                <id>github-dusk-common</id>
                <username>MouckIS</username>
                <password>${env.GH_PAT}</password>
              </server>
            </servers>
            <repositories>
              <repository>
                <id>central</id>
                <url>https://repo.maven.apache.org/maven2</url>
              </repository>
              <repository>
                <id>github-dusk-dependencies</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-dependencies</url>
              </repository>
              <repository>
                <id>github-dusk-module-parent</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-module-parent</url>
              </repository>
              <repository>
                <id>github-dusk-module-shared-parent</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-module-shared-parent</url>
              </repository>
              <repository>
                <id>github-dusk-common</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-common</url>
              </repository>
            </repositories>
          </settings>
          MAVEN_SETTINGS

      - name: Check TOKEN secret
        if: ${{ env.GH_PAT == '' }}
        shell: bash
        run: |
          echo "::error::Secret TOKEN is missing. Create a GitHub PAT with read:packages and save it as repository secret TOKEN."
          exit 1

      - name: Build and package
        run: mvn -B -ntp -U -DskipTests clean package

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ github.sha }}
          path: |
            target/*.jar
            dusk-module-workflow/target/*.jar
          if-no-files-found: warn
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/*.jar
            dusk-module-workflow/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
