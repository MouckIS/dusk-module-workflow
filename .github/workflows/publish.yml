name: Publish

on:
  push:
    branches: [main, github/*]
    tags: ['v*', '*.*.*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  GH_PAT: ${{ secrets.TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    name: Deployd to GitHub Packages
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure GitHub Packages Maven settings
        if: ${{ env.GH_PAT != '' }}
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'MAVEN_SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-dusk-dependencies</id>
                <username>MouckIS</username>
                <password>${{ env.GH_PAT }}</password>
              </server>
              <server>
                <id>github-dusk-module-parent</id>
                <username>MouckIS</username>
                <password>${{ env.GH_PAT }}</password>
              </server>
              <server>
                <id>github-dusk-module-shared-parent</id>
                <username>MouckIS</username>
                <password>${{ env.GH_PAT }}</password>
              </server>
              <server>
                <id>github-dusk-common</id>
                <username>MouckIS</username>
                <password>${{ env.GH_PAT }}</password>
              </server>
              <server>
                <id>github-dusk-module-workflow</id>
                <username>MouckIS</username>
                <password>${{ env.GH_PAT }}</password>
              </server>
            </servers>
            <repositories>
              <repository>
                <id>central</id>
                <url>https://repo.maven.apache.org/maven2</url>
              </repository>
              <repository>
                <id>github-dusk-dependencies</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-dependencies</url>
              </repository>
              <repository>
                <id>github-dusk-module-parent</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-module-parent</url>
              </repository>
              <repository>
                <id>github-dusk-module-shared-parent</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-module-shared-parent</url>
              </repository>
              <repository>
                <id>github-dusk-common</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-common</url>
              </repository>
              <repository>
                <id>github-dusk-module-workflow</id>
                <url>https://maven.pkg.github.com/MouckIS/dusk-module-workflow</url>
              </repository>
            </repositories>
          </settings>
          MAVEN_SETTINGS

      - name: Check TOKEN secret
        if: ${{ env.GH_PAT == '' }}
        shell: bash
        run: |
          echo "::error::Secret TOKEN is missing. Create a GitHub PAT with write:packages and save it as repository secret TOKEN."
          exit 1

      - name: Set Lowercase Image Name
        run: |
          echo "LOW_IMAGE_NAME=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and package
        run: mvn -B -ntp -U -DskipTests clean package

      - name: Deploy SNAPSHOT (push to main)
        if: ${{ github.ref_type == 'branch' }}
        run: mvn -B -ntp -U -DskipTests deploy

      - name: Deploy release (push tag)
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          mvn -B -ntp -N versions:set -DnewVersion="${RELEASE_VERSION}"
          mvn -B -ntp -U -DskipTests deploy

      # 提取 Spring Boot 分层
      - name: Extract Spring Boot Layers
        run: |
          mkdir -p target/extracted
          cd target/extracted
          java -Djarmode=layertools -jar ../*.jar extract

      - name: Build and Push Docker Image (Snapshot/Latest)
        if: ${{ github.ref_type == 'branch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 开启 Docker 构建缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.LOW_IMAGE_NAME }}:latest
            ${{ env.LOW_IMAGE_NAME }}:${{ github.ref_name }}
      - name: Build and Push Docker Image (Release Tag)
        if: ${{ github.ref_type == 'tag' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 开启 Docker 构建缓存加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.LOW_IMAGE_NAME }}:${{ github.ref_name }}