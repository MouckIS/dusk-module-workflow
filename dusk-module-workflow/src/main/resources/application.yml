spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:sit}
    include: common-${spring.profiles.active}
  application:
    name: ${SPRING_APPLICATION_NAME:dusk-module-workflow}
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRESS:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: sit
        group: services
      config:
        server-addr: ${NACOS_ADDRESS:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: sit
dubbo:
  application:
    # todo: 暂时禁用序列化安全检查，后续补充自定义序列化白名单
    serialize-check-status: DISABLE
    # 元数据优化
    metadataType: remote
    register-mode: instance